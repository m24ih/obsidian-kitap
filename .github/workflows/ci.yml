name: CI & Quality Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Obsidian ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test
